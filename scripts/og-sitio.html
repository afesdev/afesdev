<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<!-- Imagen para compartir el sitio (1200 × 630). Se genera con: bash scripts/generar-og.sh -->
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:Manrope,system-ui,sans-serif}
  .lienzo{position:relative;width:1200px;height:630px;color:#fff;overflow:hidden;background:
    radial-gradient(520px 360px at 82% 45%, rgba(255,107,74,.2), transparent 70%),
    radial-gradient(700px 500px at 100% 0%, #24305A 0%, transparent 60%), #101828}
  .rejilla{position:absolute;inset:0;opacity:.07;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);
    background-size:48px 48px;mask-image:radial-gradient(700px 420px at 60% 50%,#000 30%,transparent 75%)}
  .texto{position:absolute;left:72px;top:84px;width:600px}
  .marca{display:flex;align-items:center;gap:16px}
  .logo{width:72px;height:72px;border-radius:20px;background:#0B1120;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08)}
  .nombre{font-size:48px;font-weight:800;letter-spacing:-2px}
  .nombre i{display:inline-block;width:11px;height:11px;border-radius:50%;background:#FF6B4A;margin-left:3px}
  h1{margin:46px 0 0;font-size:62px;line-height:1.05;font-weight:800;letter-spacing:-2px}
  h1 em{font-style:normal;color:#FF6B4A}
  .chips{display:flex;gap:10px;margin-top:34px}
  .chip{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);border-radius:999px;padding:8px 18px;font-size:20px;font-weight:700;color:#E8ECF5}
  .tel{position:absolute;width:230px;height:490px;border-radius:36px;background:#05080F;padding:9px;box-shadow:0 30px 60px rgba(0,0,0,.45)}
  .tel div{width:100%;height:100%;border-radius:28px;overflow:hidden;background:#F8F9FA}
  .tel img{width:100%;display:block}
</style></head>
<body><div class="lienzo">
  <div class="rejilla"></div>
  <div class="tel" style="left:730px;top:120px;transform:rotate(-7deg)"><div><img src="../src/assets/apps/aprende-csharp/pantallas/inicio.png"></div></div>
  <div class="tel" style="left:930px;top:70px;transform:rotate(6deg)"><div><img src="../src/assets/apps/financially/pantallas/1.png"></div></div>
  <div class="texto">
    <div class="marca">
      <div class="logo"><svg width="52" height="52" viewBox="0 0 96 96">
        <rect x="20" y="16" width="15" height="64" rx="7.5" fill="#fff" transform="rotate(20 48 48)"/>
        <rect x="61" y="16" width="15" height="64" rx="7.5" fill="#fff" transform="rotate(-20 48 48)"/>
        <circle cx="48" cy="60" r="8" fill="#FF6B4A"/></svg></div>
      <div class="nombre">afesdev<i></i></div>
    </div>
    <h1>Creo apps reales, <em>de la idea a Google Play</em></h1>
    <div class="chips"><span class="chip">Flutter</span><span class="chip">C# y .NET</span><span class="chip">Apps a la medida</span></div>
  </div>
</div></body></html>
